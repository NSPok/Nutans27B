<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bestie! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffecd2 100%);
            color: #fff;
        }

        /* Entry Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        #splash-screen h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        #enter-btn {
            background-color: #ffffff;
            color: #ff4757;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #enter-btn:hover {
            transform: scale(1.05);
            background-color: #fff0f3;
        }

        /* Floating Background Elements Container */
        .background-animations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-item {
            position: absolute;
            bottom: -10vh;
            font-size: 1.8rem;
            animation: floatUp linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Gallery Screen */
        #main-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .photo-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .photo-container.active {
            opacity: 1;
        }

        .photo-container img {
            max-width: 80%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(255, 71, 87, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 40px; /* Leaves space for the birthday wish */
        }

        /* Birthday Wish Banner at the Bottom */
        .birthday-wish {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #fff;
            z-index: 3;
            text-shadow: 0 2px 4px rgba(216, 27, 96, 0.6);
            background: rgba(255, 107, 129, 0.4);
            padding: 10px 20px;
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <h1>Hey bestie, I made something for you! 👀</h1>
        <button id="enter-btn">Click to Enter ✨</button>
    </div>

    <!-- Floating Background Elements (Flowers, Hearts, Butterflies) -->
    <div class="background-animations">
        <div class="floating-item" style="left: 10%; animation-duration: 7s; animation-delay: 0s;">🌸</div>
        <div class="floating-item" style="left: 25%; animation-duration: 9s; animation-delay: 2s;">💖</div>
        <div class="floating-item" style="left: 40%; animation-duration: 6s; animation-delay: 1s;">🦋</div>
        <div class="floating-item" style="left: 55%; animation-duration: 8s; animation-delay: 3s;">🌸</div>
        <div class="floating-item" style="left: 70%; animation-duration: 10s; animation-delay: 0.5s;">💖</div>
        <div class="floating-item" style="left: 85%; animation-duration: 7s; animation-delay: 2.5s;">🦋</div>
        <div class="floating-item" style="left: 15%; animation-duration: 8s; animation-delay: 4s;">💖</div>
        <div class="floating-item" style="left: 60%; animation-duration: 6s; animation-delay: 3.5s;">🌸</div>
    </div>

    <!-- Main Content (Photos, Music & Birthday Wish) -->
    <div id="main-content">
        <!-- Add your image filenames here -->
        <div class="photo-container active"><img src="1.jpeg" alt="Memory 1"></div>
        <div class="photo-container"><img src="01.jpeg" alt="Memory 2"></div>
        <div class="photo-container"><img src="2.jpeg" alt="Memory 3"></div>
        <div class="photo-container"><img src="02.jpeg" alt="Memory 4"></div>
	<div class="photo-container"><img src="3.jpeg" alt="Memory 5"></div>
        <div class="photo-container"><img src="12.jpeg" alt="Memory 6"></div>
        <div class="photo-container"><img src="5.jpeg" alt="Memory 7"></div>
        <div class="photo-container"><img src="13.jpeg" alt="Memory 8"></div>
	<div class="photo-container"><img src="7.jpeg" alt="Memory 9"></div>
	<div class="photo-container"><img src="8.jpeg" alt="Memory 10"></div>
        <div class="photo-container"><img src="14.jpeg" alt="Memory 11"></div>
        <div class="photo-container"><img src="10.jpeg" alt="Memory 12"></div>
        <div class="photo-container"><img src="11.jpeg" alt="Memory 13"></div>

        <!-- Permanent Birthday Wish at the bottom -->
        <div class="birthday-wish">🎉 Happy Birthday Nutan! Wishing you a year filled with everything you've ever dreamed of. May all your dreams come true. Happy 27th Birthday to the most cheerful human in the whole wide world! 💖🎂✨</div>
    </div>

    <!-- Audio Element -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        const enterBtn = document.getElementById('enter-btn');
        const splashScreen = document.getElementById('splash-screen');
        const mainContent = document.getElementById('main-content');
        const bgMusic = document.getElementById('bg-music');
        const photoContainers = document.querySelectorAll('.photo-container');

        let currentPhotoIndex = 0;
        let slideInterval;

        enterBtn.addEventListener('click', () => {
            // Play music
            bgMusic.play().catch(error => {
                console.log("Audio playback failed:", error);
            });

            // Fade out splash screen and reveal main content
            splashScreen.style.opacity = '0';
            setTimeout(() => {
                splashScreen.style.display = 'none';
                mainContent.style.display = 'flex';
                
                // Start the slideshow timer (changes photo every 4 seconds)
                slideInterval = setInterval(nextPhoto, 4000);
            }, 800);
        });

        function nextPhoto() {
            photoContainers[currentPhotoIndex].classList.remove('active');
            currentPhotoIndex = (currentPhotoIndex + 1) % photoContainers.length;
            photoContainers[currentPhotoIndex].classList.add('active');
        }
    </script>
</body>
</html>
